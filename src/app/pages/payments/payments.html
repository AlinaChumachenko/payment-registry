<section class="grid gap-6">
  <div>
    <h1 class="text-2xl font-semibold text-slate-800">Реєстр платежів</h1>
    <p class="mt-1 text-sm">Перегляд та управління платіжними операціями</p>
  </div>
  <p class="mt-1 text-sm text-slate-500">Усього платежжів: {{ total() }}</p>

  @if (loading()) {
  <p class="text-sm text-slate-500">Завантаження платежів...</p>

  } @if (error()) {
  <p class="rounded-lg bg-red-50 p-3 text-sm text-red-700">{{ error() }}</p>
  }

  <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
    <ag-grid-angular
      class="payments-grid"
      [columnDefs]="columnDefs"
      [rowData]="rowData()"
    ></ag-grid-angular>
  </div>

  <div class="mt-4 flex items-center gap-4">
    <button
      type="button"
      class="flex h-9 w-9 items-center justify-center rounded-full border border-slate-300 bg-white transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-40"
      (click)="goToPreviousPage()"
      [disabled]="!canGoToPreviousPage()"
    >
      &lt;
    </button>

    <span class="text-sm text-slate-700"> Page {{ page() }} of {{ totalPages() }} </span>

    <button
      type="button"
      class="flex h-9 w-9 items-center justify-center rounded-full border border-slate-300 bg-white transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-40"
      (click)="goToNextPage()"
      [disabled]="!canGoToNextPage()"
    >
      &gt;
    </button>

    <label class="ml-4 flex items-center gap-2 text-sm text-slate-700">
      <span>Rows per page:</span>

      <select
        class="rounded-md border border-slate-300 px-2 py-1"
        [value]="pageSize()"
        (change)="changePageSize(+$any($event.target).value)"
      >
        <option [value]="25">25</option>
        <option [value]="50">50</option>
        <option [value]="100">100</option>
      </select>
    </label>
  </div>
</section>
